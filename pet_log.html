<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タマ日報 v16.1</title>
    <style>
        :root {
            --main-bg: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ffcc00; 
            --text-color: #e0e0e0;
            --border-radius: 16px;
        }

        body {
            font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
            background-color: var(--main-bg);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 600px; }

        header { text-align: center; margin-bottom: 20px; }
        .cat-icon { font-size: 40px; }
        h1 { font-size: 1.2rem; color: var(--accent-color); margin: 5px 0; }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        h2 { font-size: 1rem; border-left: 4px solid var(--accent-color); padding-left: 10px; margin: 0 0 15px; }
        label { display: block; margin: 10px 0 5px; font-size: 0.85rem; color: #bbb; }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .history-list { display: flex; flex-direction: column; gap: 12px; }
        .day-group, .master-collapsible { background: #252525; padding: 0; border-radius: 12px; border: 1px solid #333; overflow: hidden; }
        
        details { width: 100%; }
        summary { list-style: none; cursor: pointer; padding: 15px; outline: none; }
        summary::-webkit-details-marker { display: none; }
        
        .header-common { display: flex; justify-content: space-between; align-items: center; }
        .icon-arrow::before { content: "▶"; font-size: 0.7rem; margin-right: 8px; display: inline-block; transition: transform 0.2s; }
        details[open] .icon-arrow::before { transform: rotate(90deg); }

        .day-date, .master-title-text { font-weight: bold; color: var(--accent-color); }
        .day-total, .master-count { font-size: 0.8rem; color: #aaa; }

        .content-common { padding: 0 15px 15px 15px; border-top: 1px solid #333; }

        .entry-item, .master-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 0.85rem;
            border-bottom: 1px dotted #444;
        }
        .entry-info, .master-info { flex: 1; margin-right: 10px; line-height: 1.4; }
        .entry-actions, .master-actions { display: flex; gap: 5px; }

        .btn-edit { background: #444; color: #ffcc00; padding: 4px 8px; font-size: 0.7rem; border-radius: 4px; border: 1px solid #ffcc00; cursor: pointer; min-width: 45px;}
        .btn-delete { background: #511; color: #f66; padding: 4px 8px; font-size: 0.7rem; border-radius: 4px; border: 1px solid #f66; cursor: pointer; min-width: 45px;}
        
        .gcal-btn { display: block; background: #4285F4; color: white; padding: 10px; border-radius: 8px; font-size: 0.8rem; text-decoration: none; text-align: center; margin-top: 10px; font-weight: bold; }
        .today-row { border: 2px solid var(--accent-color); background: #1e1e0a; }
        .edit-active { border: 2px solid var(--accent-color); background: #2d2d00; }
        
        .master-list { list-style: none; padding: 0; margin: 0; }
        .sync-status { text-align: center; font-size: 0.75rem; color: #4285F4; margin-top: 10px; font-weight: bold; }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .popup-content {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid var(--accent-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            max-width: 80%;
        }
        .popup-cat-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
            margin-bottom: 15px;
        }
        .popup-text {
            color: var(--text-color);
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .popup-content button {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: auto; 
            margin-top: 0; 
        }
    </style>
</head>
<body>

<div class="container" id="top">
    <header>
        <div class="cat-icon">🐈‍⬛</div>
        <h1>タマ日報</h1>
    </header>

    <div class="card" id="inputCard">
        <h2 id="formTitle">📝 記録入力</h2>
        <label>日時を選択</label>
        <input type="datetime-local" id="recordDateTime">
        
        <label>ごはんの内容（高頻度順に表示）</label>
        <select id="foodSelect"></select>
        
        <label>量 (g, 袋, 本, cm / 0.25刻み)</label>
        <input type="number" id="amount" step="0.25" min="0" placeholder="例: 1.25">
        
        <label>💩 うんちの長さ (cm)</label>
        <input type="number" id="poopLength" placeholder="例: 8">
        
        <label>💩 うんちの状態</label>
        <select id="poopCond">
            <option value="">選択しない</option>
            <option value="ツルッとしてコロコロ">ツルッとしてコロコロ</option>
            <option value="表面ペトのコロコロ">表面ペトのコロコロ</option>
            <option value="カチカチコロコロ">カチカチコロコロ</option>
            <option value="軟便気味">軟便気味</option>
            <option value="下痢気味">下痢気味</option>
        </select>
        
        <button id="saveBtn" onclick="saveRecord()">この内容で保存する</button>
        <button id="cancelBtn" onclick="cancelEdit()" style="display:none; background:#555; color:#fff; margin-top:10px;">編集をキャンセル</button>
    </div>

    <div class="card">
        <h2>📅 履歴 (最新14日分)</h2>
        <div id="historyList" class="history-list"></div>
    </div>

    <div class="card" id="masterCard">
        <h2>🍔 フード・おやつ登録</h2>
        <input type="text" id="foodName" placeholder="例: プレミアム黒猫フード">
        <label>100g, 1袋, 1本, または 1cm あたりのkcal</label>
        <input type="number" id="foodCal" placeholder="例: 75">
        <select id="foodType">
            <option value="per100g">100gあたりの計算</option>
            <option value="perUnit">1袋あたりの計算</option>
            <option value="perStick">1本あたりの計算</option>
            <option value="perCm">1cmあたりの計算</option>
        </select>
        
        <button id="masterSaveBtn" style="background: #444; color: #fff;" onclick="saveFoodMaster()">マスターに追加</button>
        <button id="masterCancelBtn" style="display:none; background: #555; color: #fff; margin-top:10px;" onclick="cancelMasterEdit()">編集キャンセル</button>
        
        <div class="master-collapsible" style="margin-top: 20px;">
            <details id="masterDetails">
                <summary>
                    <div class="header-common">
                        <div class="master-title-text icon-arrow">📋 登録済みアイテム</div>
                        <div class="master-count" id="masterCountText">0件</div>
                    </div>
                </summary>
                <div class="content-common">
                    <ul id="masterDisplay" class="master-list"></ul>
                </div>
            </details>
        </div>
    </div>

    <div class="card" style="opacity: 0.9; font-size: 0.85rem;">
        <h2>⚙️ 設定・データお引越し</h2>
        
        <h3 style="margin-top:10px; font-size:0.9rem; border-bottom:1px solid #444; padding-bottom:5px;">📦 データを守る（バックアップ）</h3>
        <p style="font-size: 0.75rem; color: #aaa; margin-top:5px;">万が一消えた時のために、データを文字にして保存できます。</p>
        <button onclick="exportData()" style="background:#4285F4; color:#fff; font-size:0.8rem;">① データをコピーする</button>
        <button onclick="importData()" style="background:#34A853; color:#fff; font-size:0.8rem; margin-top:8px;">② コピーした文字で復元する</button>
        
        <h3 style="margin-top:20px; font-size:0.9rem; border-bottom:1px solid #444; padding-bottom:5px;">🔄 クラウド同期設定</h3>
        <label style="margin-top:10px;">Google Apps Script (GAS) のURL</label>
        <input type="text" id="gasUrl" placeholder="https://script.google.com/macros/..." onchange="saveSettings()">
        
        <button onclick="emergencyReset()" style="background:#333; color:#f66; font-size:0.75rem; margin-top:20px; padding:10px;">⚠️ すべてのデータを初期化する</button>
    </div>
</div>

<div id="errorPopup" class="popup-overlay" style="display: none;">
    <div class="popup-content">
        <img src="image_bd131d.png" alt="黒猫のタマ" class="popup-cat-img">
        <p class="popup-text" id="errorMsg">うんちの状態はどうかニャ？</p>
        <button onclick="closeErrorPopup()">はーいニャ！</button>
    </div>
</div>

<script>
    let foodMaster = [];
    let healthLogs = [];
    let userSettings = { gasUrl: '' };
    let editingIndex = -1;
    let editingMasterIndex = -1;

    function loadData() {
        try {
            foodMaster = JSON.parse(localStorage.getItem('foodMaster')) || [];
            healthLogs = JSON.parse(localStorage.getItem('healthLogs')) || [];
            userSettings = JSON.parse(localStorage.getItem('userSettings')) || { gasUrl: '' };
        } catch (e) {
            foodMaster = []; healthLogs = [];
        }
    }

    function init() {
        loadData();
        if(editingIndex === -1) setCurrentDateTime();
        const gasEl = document.getElementById('gasUrl');
        if(gasEl) gasEl.value = userSettings.gasUrl || '';
        updateFoodSelect();
        renderHistory();
    }

    function getLocalDateString(dateObj) {
        const yyyy = dateObj.getFullYear();
        const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
        const dd = String(dateObj.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    function setCurrentDateTime() {
        const now = new Date();
        const dateStr = getLocalDateString(now);
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const el = document.getElementById('recordDateTime');
        if(el) el.value = `${dateStr}T${hh}:${min}`;
    }

    function saveSettings() {
        userSettings.gasUrl = document.getElementById('gasUrl').value;
        localStorage.setItem('userSettings', JSON.stringify(userSettings));
        renderHistory(); 
    }

    function saveFoodMaster() {
        const name = document.getElementById('foodName').value;
        const cal = parseFloat(document.getElementById('foodCal').value);
        const type = document.getElementById('foodType').value;
        
        // 分かりやすいエラーメッセージに変更
        if(!name || isNaN(cal)) {
            document.getElementById('errorMsg').innerText = "「名前」と「kcal」を両方入力してニャ！";
            showErrorPopup();
            return;
        }
        
        if (editingMasterIndex > -1) {
            foodMaster[editingMasterIndex] = { name, cal, type };
            editingMasterIndex = -1;
            document.getElementById('masterSaveBtn').innerText = "マスターに追加";
            document.getElementById('masterCancelBtn').style.display = "none";
            document.getElementById('masterCard').classList.remove('edit-active');
        } else {
            foodMaster.push({ name, cal, type });
        }
        localStorage.setItem('foodMaster', JSON.stringify(foodMaster));
        document.getElementById('foodName').value = "";
        document.getElementById('foodCal').value = "";
        updateFoodSelect();
        
        // 登録後に自動でリストを開く！
        document.getElementById('masterDetails').open = true;
        
        // 追加されたことをポップアップでお知らせ
        document.getElementById('errorMsg').innerText = `「${name}」をマスターに登録したニャ！`;
        showErrorPopup();
    }

    function editFoodMaster(index) {
        const f = foodMaster[index];
        if(!f) return;
        document.getElementById('foodName').value = f.name;
        document.getElementById('foodCal').value = f.cal;
        document.getElementById('foodType').value = f.type || 'per100g';
        editingMasterIndex = index;
        document.getElementById('masterSaveBtn').innerText = "上書き保存する";
        document.getElementById('masterCancelBtn').style.display = "block";
        document.getElementById('masterCard').classList.add('edit-active');
        document.getElementById('masterCard').scrollIntoView({ behavior: 'smooth' });
    }

    function cancelMasterEdit() {
        editingMasterIndex = -1;
        document.getElementById('foodName').value = "";
        document.getElementById('foodCal').value = "";
        document.getElementById('masterSaveBtn').innerText = "マスターに追加";
        document.getElementById('masterCancelBtn').style.display = "none";
        document.getElementById('masterCard').classList.remove('edit-active');
    }

    function deleteFoodMaster(index) {
        if(confirm('削除しますか？')) {
            foodMaster.splice(index, 1);
            localStorage.setItem('foodMaster', JSON.stringify(foodMaster));
            updateFoodSelect();
        }
    }

    function updateFoodSelect() {
        const select = document.getElementById('foodSelect');
        const masterList = document.getElementById('masterDisplay');
        const countText = document.getElementById('masterCountText');
        
        const freqMap = {};
        healthLogs.forEach(log => {
            if (log.foodIdx !== undefined && log.foodIdx !== -1) {
                freqMap[log.foodIdx] = (freqMap[log.foodIdx] || 0) + 1;
            }
        });

        const sortedIndices = foodMaster.map((_, i) => i).sort((a, b) => {
            return (freqMap[b] || 0) - (freqMap[a] || 0);
        });

        if(select) {
            select.innerHTML = sortedIndices.map(i => `<option value="${i}">${foodMaster[i].name}</option>`).join('');
        }
        
        if(countText) countText.innerText = `${foodMaster.length}件`;

        if(masterList) {
            if(foodMaster.length === 0) masterList.innerHTML = "<li style='color:#666; padding:15px 0;'>まだ登録されていません</li>";
            else {
                masterList.innerHTML = sortedIndices.map(i => {
                    const f = foodMaster[i];
                    const typeLabel = f.type === 'per100g' ? '100g' : (f.type === 'perUnit' ? '1袋' : (f.type === 'perStick' ? '1本' : '1cm'));
                    return `<li class="master-item"><div class="master-info"><b>${f.name}</b><br><small style="color:#aaa;">${f.cal}kcal / ${typeLabel}</small></div><div class="master-actions"><button class="btn-edit" onclick="editFoodMaster(${i})">編集</button><button class="btn-delete" onclick="deleteFoodMaster(${i})">削除</button></div></li>`;
                }).join('');
            }
        }
    }

    function showErrorPopup() {
        document.getElementById('errorPopup').style.display = 'flex';
    }
    function closeErrorPopup() {
        document.getElementById('errorPopup').style.display = 'none';
        // 閉じた時にエラーメッセージをリセットしておく
        document.getElementById('errorMsg').innerText = "うんちの状態はどうかニャ？"; 
    }

    function saveRecord() {
        const dtStr = document.getElementById('recordDateTime').value;
        if(!dtStr) return alert('日時を選択してください');
        const parts = dtStr.split('T');
        const dateStr = parts[0];
        const timeStr = parts[1] || "00:00";
        const foodIdx = document.getElementById('foodSelect').value;
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const poop = parseFloat(document.getElementById('poopLength').value) || 0;
        const poopCond = document.getElementById('poopCond').value;

        if (poop > 0 && poopCond === "") {
            document.getElementById('errorMsg').innerText = "うんちの状態はどうかニャ？";
            showErrorPopup(); 
            return; 
        }

        let calResult = 0; let detail = ""; let finalFoodIdx = -1; let finalAmount = 0;

        if (poop > 0 || poopCond !== "") {
            let pInfos = [];
            if(poop > 0) pInfos.push(`${poop}cm`);
            if(poopCond) pInfos.push(poopCond);
            detail = `💩 うんち記録 (${pInfos.join(' / ')})`;
        } else if (amount > 0) {
            const food = foodMaster[foodIdx];
            if(food) {
                const unitLabel = food.type === 'per100g' ? 'g' : (food.type === 'perUnit' ? '袋' : (food.type === 'perStick' ? '本' : 'cm'));
                calResult = food.type === 'per100g' ? (food.cal * amount / 100) : (food.cal * amount);
                detail = `🍴 ${food.name} ${amount}${unitLabel}`;
                finalFoodIdx = parseInt(foodIdx); finalAmount = amount;
            } else return alert('フードを選択してください');
        } else return alert('入力してください');

        const newLog = { 
            date: dateStr, time: timeStr, kcal: calResult, poop: poop, poopCond: poopCond, detail: detail, amount: finalAmount, foodIdx: finalFoodIdx 
        };
        
        if(editingIndex > -1) { healthLogs[editingIndex] = newLog; editingIndex = -1; }
        else healthLogs.push(newLog);

        localStorage.setItem('healthLogs', JSON.stringify(healthLogs));
        syncToGoogleCalendar(dateStr);
        resetForm();
        updateFoodSelect(); 
        renderHistory();
    }

    async function syncToGoogleCalendar(dateStr) {
        const gasUrl = userSettings.gasUrl;
        if (!gasUrl || !gasUrl.startsWith("http")) return;
        const dayLogs = healthLogs.filter(l => l.date === dateStr);
        const totalKcal = dayLogs.reduce((sum, l) => sum + (Number(l.kcal) || 0), 0).toFixed(0);
        const totalPoop = dayLogs.reduce((sum, l) => sum + (Number(l.poop) || 0), 0).toFixed(1);
        let details = "■内訳\n";
        dayLogs.sort((a, b) => (a.time || "00:00").localeCompare(b.time || "00:00")).forEach(l => { details += `・${l.time}：${l.detail}\n`; });
        try { fetch(gasUrl, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ date: dateStr, totalKcal: totalKcal, totalPoop: totalPoop, details: details }) }); } catch (e) {}
    }

    function editRecord(index) {
        editingIndex = index;
        const log = healthLogs[index];
        if(!log) return;
        document.getElementById('recordDateTime').value = `${log.date}T${log.time || '00:00'}`;
        document.getElementById('foodSelect').value = log.foodIdx !== undefined ? log.foodIdx : -1;
        document.getElementById('amount').value = log.amount || 0;
        document.getElementById('poopLength').value = log.poop || 0;
        document.getElementById('poopCond').value = log.poopCond || "";
        document.getElementById('formTitle').innerText = "⚠️ 修正中";
        document.getElementById('saveBtn').innerText = "上書き保存";
        document.getElementById('cancelBtn').style.display = "block";
        document.getElementById('inputCard').classList.add('edit-active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteRecord(index) {
        if(confirm('消去しますか？')) {
            const dateStr = healthLogs[index].date;
            healthLogs.splice(index, 1);
            localStorage.setItem('healthLogs', JSON.stringify(healthLogs));
            syncToGoogleCalendar(dateStr);
            updateFoodSelect();
            renderHistory();
        }
    }

    function cancelEdit() { editingIndex = -1; resetForm(); }

    function resetForm() {
        document.getElementById('formTitle').innerText = "📝 記録入力";
        document.getElementById('saveBtn').innerText = "この内容で保存する";
        document.getElementById('cancelBtn').style.display = "none";
        document.getElementById('inputCard').classList.remove('edit-active');
        document.getElementById('amount').value = "";
        document.getElementById('poopLength').value = "";
        document.getElementById('poopCond').value = "";
        setCurrentDateTime();
    }

    function emergencyReset() { if(confirm('初期化しますか？')) { localStorage.clear(); location.reload(); } }

    // ▼ 新規追加：データお引越し機能 ▼
    function exportData() {
        const data = {
            foodMaster: foodMaster,
            healthLogs: healthLogs,
            userSettings: userSettings
        };
        const str = JSON.stringify(data);
        const userAction = prompt("【ステップ1】\n下の枠にある文字をすべてコピー（全選択してコピー）し、スマホの「メモ帳」や「LINEのKeep」に貼り付けて保管してください。\n※これがあなたのバックアップデータです！", str);
    }

    function importData() {
        const str = prompt("【ステップ2】\nメモ帳などに保存しておいた「文字の塊」をここに貼り付けて、「OK」を押してください。");
        if (!str) return;
        try {
            const data = JSON.parse(str);
            if (data.foodMaster && data.healthLogs) {
                localStorage.setItem('foodMaster', JSON.stringify(data.foodMaster));
                localStorage.setItem('healthLogs', JSON.stringify(data.healthLogs));
                if(data.userSettings) localStorage.setItem('userSettings', JSON.stringify(data.userSettings));
                alert("データの復元に大成功しました！画面をリロードします。");
                location.reload();
            } else {
                alert("データの中身が少し違うようです。コピー漏れがないか確認してくださいニャ。");
            }
        } catch(e) {
            alert("データの読み込みに失敗しました。文字が途切れている可能性がありますニャ。");
        }
    }
    // ▲ ここまで ▲

    window.onload = init;
</script>
</body>
</html>
